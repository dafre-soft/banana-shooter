# ============================================================
#  UDPLIB - конфигурация версии (используется build.sh)
# ============================================================
# MAJOR.MINOR.PATCH - версия библиотеки, выводится командой "udplib"
VERSION_MAJOR=1
VERSION_MINOR=0
VERSION_PATCH=0

# Имя продукта в консоли игры
PRODUCT_NAME=UDPLIB

# Порт встроенного UDP-сервера библиотеки (чистые UDP-клиенты)
UDP_PORT=27777

# Максимум чистых UDP-клиентов на борту
MAX_UDP_CLIENTS=8

# Пароль администратора UDPLIB (защита пароля).
# Если задан UDPLIB_PASSWORD_HASH (SHA-256 hex), то используется он,
# иначе build.sh рассчитает хэш из UDPLIB_PASSWORD автоматически.
UDPLIB_PASSWORD=changeme
UDPLIB_PASSWORD_HASH=
